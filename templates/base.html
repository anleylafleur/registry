<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Soccer Registry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Soccer Registry DB</span>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('countries') }}">Countries</a>
<a class="btn btn-outline-light btn-sm" href="{{ url_for('players') }}">Players</a>
<a class="btn btn-outline-light btn-sm" href="{{ url_for('scouting_reports') }}">
    Scouting Reports
</a>  
</div>
</nav>

<div class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</div>

<script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
